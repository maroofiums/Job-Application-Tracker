{% extends "base.html" %}


{% block title %}
{{ title }} | JobTrack
{% endblock %}




{% block content %}


<div class="container py-5">


<div class="row justify-content-center">


<div class="col-lg-7">



<div class="card border-0 shadow-sm">


<div class="card-body p-4">



<h2 class="fw-bold mb-4">

{{ title }}

</h2>




<form method="POST">


{% csrf_token %}




{% for field in form %}


<div class="mb-3">


<label class="form-label fw-semibold">

{{ field.label }}

</label>



{{ field }}



{% if field.errors %}

<div class="text-danger small">

{{ field.errors }}

</div>

{% endif %}



</div>



{% endfor %}





<div class="d-flex gap-2">


<button
class="btn btn-dark"
>

Save

</button>


<a
href="{% url 'interview_list' %}"
class="btn btn-outline-secondary"
>

Cancel

</a>


</div>




</form>



</div>


</div>



</div>


</div>


</div>


{% endblock %}
