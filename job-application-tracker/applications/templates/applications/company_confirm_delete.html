{% extends "base.html" %}

{% block title %}Delete Company | JobTrack{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5 text-center">

                    <div
                        class="bg-danger-subtle
                               text-danger
                               rounded-circle
                               d-inline-flex
                               align-items-center
                               justify-content-center
                               mb-3"
                        style="width: 60px; height: 60px;"
                    >
                        !
                    </div>

                    <h3 class="fw-bold">
                        Delete Company?
                    </h3>

                    <p class="text-muted">
                        Are you sure you want to delete
                        <strong>{{ company.name }}</strong>?
                    </p>

                    <p class="text-danger small">
                        This may also delete its related applications.
                    </p>


                    <form method="POST">

                        {% csrf_token %}

                        <div class="d-flex
                                    justify-content-center
                                    gap-2">

                            <a
                                href="{% url 'company_list' %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                Delete Company
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
